name: gx-release
run-name: "${{ inputs.publish && 'Release' || 'Build only' }} · ${{ inputs.version || 'CHANGELOG version' }} · ${{ inputs.ref }}"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 构建分支、标签或提交（main 用于同步上游）
        required: true
        default: feature/gx_wezterm
        type: string
      version:
        description: 包版本（留空自动读取 CHANGELOG；手填 X.Y.Z 必须与其一致）
        required: false
        type: string
      publish:
        description: 发布到 Releases（取消勾选只构建和验证，从 Artifacts 下载）
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: gx-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'gx0404/wezterm'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.prepare.outputs.sha }}
      version: ${{ steps.prepare.outputs.version }}
      rust: ${{ steps.prepare.outputs.rust }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Resolve source/version and check release conflicts
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          GX_VERSION: ${{ inputs.version }}
          GX_PUBLISH: ${{ inputs.publish }}
        run: |
          args=()
          if [ "$GX_PUBLISH" = true ]; then args+=(--publish); fi
          python3 scripts/gx_release.py prepare --version "$GX_VERSION" "${args[@]}"
      - name: Validate fork rules and command configuration
        run: |
          python3 scripts/resolve_agent_rules.py --check
          python3 scripts/dev_framework.py ready
          python3 scripts/version.py --check

  windows:
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      SCCACHE_GHA_ENABLED: 'true'
      TZ: UTC
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.prepare.outputs.rust }}
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.18.0
      - name: Install pinned Inno Setup
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          $destination = Join-Path $env:RUNNER_TEMP 'gx-inno'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          $expected = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $expected) { throw 'Inno Setup checksum mismatch' }
          $installed = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=`"$destination`"" -WindowStyle Hidden -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "Inno Setup installation failed: $($installed.ExitCode)" }
          $compiler = Join-Path $destination 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup compiler missing' }
          "ISCC=$compiler" >> $env:GITHUB_ENV
      - name: Test packaging and launcher
        shell: pwsh
        run: |
          python -m unittest discover -s scripts -p test_gx_*.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force .local/gx-tests | Out-Null
          rustc --edition=2021 --test scripts/gx-launcher/main.rs -o .local/gx-tests/launcher-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .local/gx-tests/launcher-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and package Windows installer
        shell: pwsh
        env:
          GX_VERSION: ${{ needs.prepare.outputs.version }}
          RUSTC_WRAPPER: sccache
        run: |
          $env:PATH = "C:\Strawberry\perl\bin;" + $env:PATH
          python scripts/gx_package.py windows --version $env:GX_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install, initialize and uninstall in isolation
        shell: pwsh
        run: ./scripts/gx_smoke_windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: gx-windows-installer
          path: dist/WezTerm-GX-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Save Windows installer diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-windows
          path: .ui-evidence/gx-package-windows/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  linux:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      TZ: UTC
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.prepare.outputs.rust }}
          components: rustfmt
      - name: Restore Ubuntu 20.04 Cargo cache
        uses: actions/cache@v6
        with:
          path: .local/gx-deb-cache
          key: gx-focal-amd64-${{ needs.prepare.outputs.rust }}-${{ hashFiles('Cargo.lock', 'get-deps', 'scripts/packaging/ubuntu2004.Dockerfile') }}-${{ needs.prepare.outputs.sha }}
          restore-keys: |
            gx-focal-amd64-${{ needs.prepare.outputs.rust }}-${{ hashFiles('Cargo.lock', 'get-deps', 'scripts/packaging/ubuntu2004.Dockerfile') }}-
      - name: Install build and validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
      - name: Test packaging, Lua and launcher
        run: |
          rustfmt --edition 2021 --check scripts/gx-launcher/main.rs
          python3 -m unittest discover -s scripts -p 'test_gx_*.py'
          lua5.4 scripts/tests/gx_resurrect.lua
          mkdir -p .local/gx-tests
          rustc --edition=2021 --test scripts/gx-launcher/main.rs -o .local/gx-tests/launcher-tests
          .local/gx-tests/launcher-tests
      - name: Build one portable deb on the Ubuntu 20.04 baseline
        env:
          GX_VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/gx_package.py deb --container --cache-dir .local/gx-deb-cache --version "$GX_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: gx-linux-deb
          path: dist/wezterm-gx_*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  linux-verify:
    needs: [prepare, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['20.04', '24.04']
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: gx-linux-deb
          path: dist
      - name: Validate the same deb in a clean Ubuntu container
        env:
          GX_UBUNTU: ${{ matrix.ubuntu }}
        run: |
          (cd dist && sha256sum -c ./*.sha256)
          docker run --rm --volume "$PWD:/workspace" --workdir /workspace "ubuntu:$GX_UBUNTU" bash -eu -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y xvfb xauth x11-apps ffmpeg
            useradd --create-home gx-smoke
            GX_SMOKE_USER=gx-smoke bash scripts/gx_smoke_linux.sh --allow-system-install
          '
      - name: Save GUI smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-linux-${{ matrix.ubuntu }}
          path: .ui-evidence/gx-package-linux/
          include-hidden-files: true
          retention-days: 14

  verify:
    needs: [prepare, windows, linux, linux-verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: gx-*
          merge-multiple: true
          path: dist
      - name: Verify both packages even in build-only mode
        env:
          GX_VERSION: ${{ needs.prepare.outputs.version }}
          GX_SHA: ${{ needs.prepare.outputs.sha }}
        run: python3 scripts/gx_release.py verify --version "$GX_VERSION" --sha "$GX_SHA"

  publish:
    needs: [prepare, verify]
    if: inputs.publish && github.repository == 'gx0404/wezterm'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: gx-*
          merge-multiple: true
          path: dist
      - name: Verify both packages and publish complete draft
        env:
          GH_TOKEN: ${{ github.token }}
          GX_VERSION: ${{ needs.prepare.outputs.version }}
          GX_SHA: ${{ needs.prepare.outputs.sha }}
        run: python3 scripts/gx_release.py publish --version "$GX_VERSION" --sha "$GX_SHA"
