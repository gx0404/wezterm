# wezterm 危险模式唯一真源。被 .claude/hooks/pre_tool_use_gate.py 与
# .codex/hooks/pre_tool_use_policy.py 消费；改模式必须跑
# python3 -m unittest scripts.test_ai_tool_hooks 并演练允许/拒绝探针。
# 列：SECTION<TAB>regex<TAB>理由<TAB>级别（deny|ask，缺省 deny）
# SECTION=SHELL 作用于 Bash command；SECTION=FILE 作用于 Edit/Write file_path。
SHELL	(?m)(?:^|[;&|({`]|\$\(|\b(?:sudo|xargs|exec|nohup|env|timeout|then|do|else|bash|sh|zsh|eval)\b[^\n;&|]*?[\s'"])\s*(?:\w+=\S*\s+)*git(?:\s+-{1,2}[\w-]+(?:[= ]\S+)?)*?\s+push\b[^\n;&|]*(\s--force(\s|$)|\s-f(\s|$))	禁止 force push：改写共享历史	deny
SHELL	(?m)(?:^|[;&|({`]|\$\(|\b(?:sudo|xargs|exec|nohup|env|timeout|then|do|else|bash|sh|zsh|eval)\b[^\n;&|]*?[\s'"])\s*(?:\w+=\S*\s+)*git(?:\s+-{1,2}[\w-]+(?:[= ]\S+)?)*?\s+push\b[^\n;&|]*\s--force-with-lease\b	force-with-lease 需人工确认	ask
SHELL	(?m)(?:^|[;&|({`]|\$\(|\b(?:sudo|xargs|exec|nohup|env|timeout|then|do|else|bash|sh|zsh|eval)\b[^\n;&|]*?[\s'"])\s*(?:\w+=\S*\s+)*git(?:\s+-{1,2}[\w-]+(?:[= ]\S+)?)*?\s+push\b[^\n;&|]*\bupstream\b	fork 永不推送上游 wezterm/wezterm	deny
SHELL	(?m)(?:^|[;&|({`]|\$\(|\b(?:sudo|xargs|exec|nohup|env|timeout|then|do|else|bash|sh|zsh|eval)\b[^\n;&|]*?[\s'"])\s*(?:\w+=\S*\s+)*git(?:\s+-{1,2}[\w-]+(?:[= ]\S+)?)*?\s+commit\b[^\n]*(\s--no-verify(?=[\s;&|)]|$)|\s-n(?=[\s;&|)]|$))	不得绕过仓库 hooks	deny
SHELL	(?m)(?:^|[;&|({`]|\$\(|\b(?:sudo|xargs|exec|nohup|env|timeout|then|do|else|bash|sh|zsh|eval)\b[^\n;&|]*?[\s'"])\s*(?:\w+=\S*\s+)*git(?:\s+-{1,2}[\w-]+(?:[= ]\S+)?)*?\s+add\b[^\n]*(\s(?:-f|--force)\b)	不得强制添加被忽略文件	deny
SHELL	(?m)(?:^|[;&|({`]|\$\(|\b(?:sudo|xargs|exec|nohup|env|timeout|then|do|else|bash|sh|zsh|eval)\b[^\n;&|]*?[\s'"])\s*(?:\w+=\S*\s+)*git(?:\s+-{1,2}[\w-]+(?:[= ]\S+)?)*?\s+add\b[^\n]*(\s-A\b|\s--all\b)	整仓暂存需授权：只精确暂存本轮相关文件	ask
SHELL	(?m)(?:^|[;&|({`]|\$\(|\b(?:sudo|xargs|exec|nohup|env|timeout|then|do|else|bash|sh|zsh|eval)\b[^\n;&|]*?[\s'"])\s*(?:\w+=\S*\s+)*git(?:\s+-{1,2}[\w-]+(?:[= ]\S+)?)*?\s+(filter-branch|replace\b|reflog\s+expire)\b	禁止重写历史	deny
SHELL	(?m)(?:^|[;&|({`]|\$\(|\b(?:sudo|xargs|exec|nohup|env|timeout|then|do|else|bash|sh|zsh|eval)\b[^\n;&|]*?[\s'"])\s*(?:\w+=\S*\s+)*git(?:\s+-{1,2}[\w-]+(?:[= ]\S+)?)*?\s+reset\b[^\n]*--hard	hard reset 丢弃工作区改动，需人工确认	ask
SHELL	(?m)(?:^|[;&|({`]|\$\(|\b(?:sudo|xargs|exec|nohup|env|timeout|then|do|else|bash|sh|zsh|eval)\b[^\n;&|]*?[\s'"])\s*(?:\w+=\S*\s+)*git(?:\s+-{1,2}[\w-]+(?:[= ]\S+)?)*?\s+clean\b	clean 丢弃未跟踪文件，需人工确认	ask
SHELL	(?m)(?:^|[;&|({`]|\$\(|\b(?:sudo|xargs|exec|nohup|env|timeout|then|do|else|bash|sh|zsh|eval)\b[^\n;&|]*?[\s'"])\s*(?:\w+=\S*\s+)*gh\s+pr\s+(merge|create|edit|close)\b[^\n]*\bwezterm/wezterm\b	上游 PR 由人类操作	deny
SHELL	(?m)(?:^|[;&|({`]|\$\(|\b(?:sudo|xargs|exec|nohup|env|timeout|then|do|else|bash|sh|zsh|eval)\b[^\n;&|]*?[\s'"])\s*(?:\w+=\S*\s+)*gh\s+release\s+(create|edit|delete|upload|delete-asset)\b	发布动作仅限上游维护者	deny
SHELL	(?m)(?:^|[;&|({`]|\$\(|\b(?:sudo|xargs|exec|nohup|env|timeout|then|do|else|bash|sh|zsh|eval)\b[^\n;&|]*?[\s'"])\s*(?:\w+=\S*\s+)*cargo\s+publish\b	fork 不经 crates.io 发布	deny
SHELL	>\s*(\./)?(\.tag|docs/changelog\.md)\b	发布标记与上游 changelog 不手写（fork 变更记 CHANGELOG.md）	deny
SHELL	(?m)(?:^|[;&|({`]|\$\(|\b(?:sudo|xargs|exec|nohup|env|timeout|then|do|else|bash|sh|zsh|eval)\b[^\n;&|]*?[\s'"])\s*(?:\w+=\S*\s+)*(sed|tee|truncate|dd)\b[^\n]*\b(docs/changelog\.md|\.tag)\b	发布产物不得手改	deny
SHELL	(?m)(?:^|[;&|({`]|\$\(|\b(?:sudo|xargs|exec|nohup|env|timeout|then|do|else|bash|sh|zsh|eval)\b[^\n;&|]*?[\s'"])\s*(?:\w+=\S*\s+)*(cat|cp|head|tail|less|base64)\b[^\n]*((~/\.ssh/|/\.ssh/)|id_rsa|id_ed25519|\.pem\b|\.env\b)	不读取凭据与私钥	deny
SHELL	(?m)(?:^|[;&|({`]|\$\(|\b(?:sudo|xargs|exec|nohup|env|timeout|then|do|else|bash|sh|zsh|eval)\b[^\n;&|]*?[\s'"])\s*(?:\w+=\S*\s+)*(?:pkill|killall)\b	不杀不明进程：先确认目标归属	ask
FILE	^\.tag$	发布标记由 ci/tag.sh 生成	deny
FILE	^docs/changelog\.md$	上游 changelog 随上游同步产生；fork 变更记录根 CHANGELOG.md	deny
FILE	^graphify-out/	图谱由 make graph 生成，不手改	deny
FILE	^kb/chunks\.json$	知识库由 make kb 生成，不手改	deny
FILE	^\.local/	钉版工具目录由 scripts/setup_env.sh 管理	deny
FILE	^deps/harfbuzz/harfbuzz/	上游 submodule 不手改：随 git submodule update 同步	deny
FILE	^deps/freetype/(libpng|zlib|freetype2)/	上游 submodule 不手改：随 git submodule update 同步	deny
FILE	(^|/)\.env(\.|$)	环境秘密不入库不读取	deny
FILE	(^|/)id_(rsa|ed25519)(\.|$)|\.pem$|\.ssh/	凭据与私钥不读取	deny
